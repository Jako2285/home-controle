
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VYRO_01 Order Tutorial</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #111;
  font-family: Arial, sans-serif;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
}

.video {
  position: relative;
  width: min(100vw, 56.25vh);
  aspect-ratio: 9 / 16;
  overflow: hidden;
  background: white;
}

iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: white;
}

/* Overlay elements */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 10;
  pointer-events: none;
  opacity: 0;
  transition: opacity .35s ease;
}

.overlay.show { opacity: 1; }

.annotation {
  position: absolute;
  left: 8%;
  width: 84%;
  padding: 8px 12px;
  color: #111;
  background: rgba(255,255,255,.96);
  border: 1px solid #bbb;
  border-radius: 5px;
  font-size: clamp(11px, 3.2vw, 15px);
  font-weight: 700;
  box-shadow: 0 2px 8px #0002;
}

/* Adjust these top values to match the real form */
.name { top: 54%; }
.phone { top: 61%; }
.address { top: 68%; }
.note { top: 75%; }

.circle {
  position: absolute;
  left: 5%;
  top: 84%;
  width: 90%;
  height: 7%;
  border: 4px solid #ff2020;
  border-radius: 50%;
  transform: rotate(-2deg);
  box-shadow: 0 0 5px #ff202066;
}

.instructions {
  position: absolute;
  z-index: 20;
  top: 8%;
  left: 5%;
  right: 5%;
  padding: 12px;
  color: white;
  background: rgba(0,0,0,.88);
  border-left: 3px solid #c5a66c;
  font-size: 13px;
  line-height: 1.5;
  text-align: center;
  opacity: 0;
  transition: opacity .3s;
  pointer-events: none;
}

.instructions.show { opacity: 1; }

.brand {
  position: absolute;
  inset: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  background: #080808;
  color: white;
  opacity: 0;
  pointer-events: none;
  transition: opacity .5s;
}

.brand.show { opacity: 1; }

.brand strong {
  font-size: 36px;
  letter-spacing: 4px;
}

.brand span {
  margin-top: 12px;
  color: #c5a66c;
  font-size: 9px;
  letter-spacing: 4px;
}

.controls {
  position: fixed;
  bottom: 12px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  gap: 8px;
  z-index: 50;
}

button {
  padding: 10px 14px;
  color: white;
  background: #252525;
  border: 1px solid #666;
  border-radius: 22px;
}
</style>
</head>

<body>

<div class="video">

  <!-- Real VYRO_01 store -->
  <iframe
    id="store"
    src="https://jako2285.github.io/VYRO_01/"
    title="VYRO_01 Store">
  </iframe>

  <!-- Visual annotations, not actual form input -->
  <div class="overlay" id="formOverlay">
    <div class="annotation name">
      FOLAN BEN FOLAN
    </div>

    <div class="annotation phone">
      56*******
    </div>

    <div class="annotation address">
      YOUR ADRESSE
    </div>

    <div class="annotation note">
      Code promo if u have
    </div>

    <div class="circle"></div>
  </div>

  <div class="instructions" id="instructions">
    Select your product, complete your details<br>
    and confirm your order.
  </div>

  <div class="brand" id="brand">
    <strong>VYRO_01</strong>
    <span>DEFINE YOUR STYLE</span>
  </div>

</div>

<div class="controls" id="controls">
  <button onclick="startVideo()">▶ Start</button>
  <button onclick="pauseVideo()">Ⅱ Pause</button>
  <button onclick="startVideo()">↻ Restart</button>
</div>

<script>
let timer = null;
let startTime = 0;
let elapsed = 0;
let playing = false;

const overlay = document.getElementById("formOverlay");
const instructions = document.getElementById("instructions");
const brand = document.getElementById("brand");
const controls = document.getElementById("controls");

function showScene(seconds) {
  overlay.classList.remove("show");
  instructions.classList.remove("show");
  brand.classList.remove("show");

  if (seconds < 3) {
    instructions.innerHTML =
      "01 — EXPLORE THE COLLECTION";
    instructions.classList.add("show");
  } else if (seconds < 6) {
    instructions.innerHTML =
      "02 — CHOOSE YOUR PRODUCT";
    instructions.classList.add("show");
  } else if (seconds < 13) {
    instructions.innerHTML =
      "03 — COMPLETE YOUR ORDER";
    instructions.classList.add("show");
    overlay.classList.add("show");
  } else {
    brand.classList.add("show");
  }
}

function tick() {
  if (!playing) return;

  elapsed = (performance.now() - startTime) / 1000;

  showScene(elapsed);

  if (elapsed >= 15) {
    playing = false;
    clearInterval(timer);
    timer = null;
    controls.style.display = "flex";
    return;
  }
}

function startVideo() {
  clearInterval(timer);
  elapsed = 0;
  startTime = performance.now();
  playing = true;
  controls.style.display = "none";

  showScene(0);
  timer = setInterval(tick, 50);
}

function pauseVideo() {
  if (playing) {
    elapsed = (performance.now() - startTime) / 1000;
    playing = false;
    clearInterval(timer);
    timer = null;
    controls.style.display = "flex";
  } else {
    startTime = performance.now() - elapsed * 1000;
    playing = true;
    controls.style.display = "none";
    timer = setInterval(tick, 50);
  }
}

showScene(0);
</script>

</body>
</html>
