
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VYRO_01 — How to order</title>
<style>
:root{--gold:#bda36b;--ink:#111;--paper:#f7f7f5}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#111;overflow:hidden}
body{display:grid;place-items:center}
.stage{position:relative;width:min(100vw,56.25vh);
height:min(100vh,177.78vw);aspect-ratio:9/16;
background:var(--paper);overflow:hidden;isolation:isolate}
.status{height:30px;background:#fff;color:#111;
display:flex;align-items:center;justify-content:space-between;
padding:0 20px;font-size:11px;font-weight:700;
position:absolute;top:0;left:0;right:0;z-index:10}
.statusright{display:flex;align-items:center;gap:5px}
.battery{width:17px;height:8px;border:1px solid #111;
border-radius:2px;position:relative}
.battery:before{content:"";position:absolute;left:1px;top:1px;
bottom:1px;width:10px;background:#111}
.battery:after{content:"";position:absolute;right:-3px;
top:2px;height:3px;width:2px;background:#111}
.siteframe{position:absolute;inset:30px 0 0;width:100%;
height:calc(100% - 30px);border:0;background:#fff}
.caption{position:absolute;left:13px;right:13px;bottom:28px;
z-index:20;background:rgba(13,13,13,.94);color:#fff;
padding:12px 14px;border-left:2px solid var(--gold);
opacity:0;transform:translateY(8px);
transition:opacity .22s,transform .22s;pointer-events:none}
.caption.show{opacity:1;transform:translateY(0)}
.step{font-size:8px;letter-spacing:2px;color:var(--gold);margin-bottom:5px}
.caption strong{font-size:14px;line-height:1.2}
.caption p{font-size:10px;color:#ddd;line-height:1.4;margin:4px 0 0}
.endcard{position:absolute;inset:0;z-index:30;background:#090909;
color:#fff;display:flex;flex-direction:column;align-items:center;
justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}
.endcard.show{opacity:1}
.endlogo{font-size:clamp(30px,9vw,43px);font-weight:900;letter-spacing:4px}
.goldline{height:1px;width:36px;background:var(--gold);margin-top:15px}
.endtag{margin-top:12px;font-size:7px;letter-spacing:3px;color:#aaa}
.homebar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);
width:90px;height:4px;border-radius:4px;background:#111;z-index:40}
.endcard .homebar{background:#fff}
.progress{position:absolute;z-index:41;bottom:0;left:0;height:2px;
width:0;background:var(--gold)}
.controls{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
display:flex;gap:8px;align-items:center;white-space:nowrap;
color:#fff;font-size:12px}
.controls button{border:1px solid #ffffff55;border-radius:22px;
background:#242424;color:#fff;padding:9px 13px;font:inherit}
.controls span{font-size:10px;color:#ccc}
@media(min-width:600px){
.stage{box-shadow:0 10px 60px #0009;border:1px solid #333;border-radius:25px}
.status{border-radius:24px 24px 0 0}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="status">
    <span>9:41</span>
    <div class="statusright">
      <span>●●●</span><span>Wi-Fi</span><span class="battery"></span>
    </div>
  </div>

  <!-- Actual live VYRO_01 website -->
  <iframe class="siteframe" id="store"
    src="https://jako2285.github.io/VYRO_01/"
    title="Live VYRO_01 store">
  </iframe>

  <div class="caption" id="caption">
    <div class="step" id="step">STEP 01</div>
    <strong id="heading">Explore the collection</strong>
    <p id="description">Browse the real VYRO_01 store and tap the product you want.</p>
  </div>

  <div class="endcard" id="endcard">
    <div class="endlogo">VYRO_01</div>
    <div class="goldline"></div>
    <div class="endtag">DEFINE YOUR STYLE</div>
    <div class="homebar"></div>
  </div>

  <div class="homebar"></div>
  <div class="progress" id="progress"></div>
</div>

<div class="controls" id="controls">
  <button id="start">▶ Start 15s guide</button>
  <button id="pause">Ⅱ Pause</button>
  <button id="restart">↻ Restart</button>
  <span>Live store · 9:16</span>
</div>

<script>
(()=>{
 const $=id=>document.getElementById(id);

 const scenes=[
  {
   at:0,
   step:'STEP 01 / DISCOVER',
   title:'Explore the collection',
   desc:'Browse the real VYRO_01 store and tap the product you want.'
  },
  {
   at:3,
   step:'STEP 02 / SELECT',
   title:'Open your product',
   desc:'Choose the piece you like and review its details.'
  },
  {
   at:6,
   step:'STEP 03 / YOUR DETAILS',
   title:'Fill in the order form',
   desc:'Enter your full name, phone number, delivery address and quantity. Notes are optional.'
  },
  {
   at:10.5,
   step:'STEP 04 / CONFIRM',
   title:'Confirm your order',
   desc:'Check your details, then tap CONFIRM ORDER on the real store.'
  },
  {
   at:13,
   step:'VYRO_01',
   title:'',
   desc:''
  }
 ];

 let raf=0,startAt=0,elapsed=0,running=false,sceneIndex=-1;

 function renderScene(index){
  if(index===sceneIndex)return;
  sceneIndex=index;
  const s=scenes[index];

  if(index===4){
   $('caption').classList.remove('show');
   $('endcard').classList.add('show');
   return;
  }

  $('endcard').classList.remove('show');
  $('step').textContent=s.step;
  $('heading').textContent=s.title;
  $('description').textContent=s.desc;
  $('caption').classList.add('show');
 }

 function tick(now){
  if(!running)return;

  elapsed=(now-startAt)/1000;

  let idx=0;
  for(let i=0;i<scenes.length;i++){
   if(elapsed>=scenes[i].at)idx=i;
  }

  renderScene(idx);
  $('progress').style.width=Math.min(100,elapsed/15*100)+'%';

  if(elapsed>=15){
   running=false;
   $('pause').textContent='Ⅱ Pause';
   $('controls').style.display='flex';
   return;
  }

  raf=requestAnimationFrame(tick);
 }

 function begin(){
  cancelAnimationFrame(raf);
  elapsed=0;
  startAt=performance.now();
  running=true;
  sceneIndex=-1;
  $('progress').style.width='0%';
  $('endcard').classList.remove('show');
  $('controls').style.display='none';
  raf=requestAnimationFrame(tick);
 }

 $('start').addEventListener('click',begin);
 $('restart').addEventListener('click',begin);

 $('pause').addEventListener('click',()=>{
  if(running){
   running=false;
   cancelAnimationFrame(raf);
   $('pause').textContent='▶ Resume';
   $('controls').style.display='flex';
  }else{
   startAt=performance.now()-elapsed*1000;
   running=true;
   $('pause').textContent='Ⅱ Pause';
   $('controls').style.display='none';
   raf=requestAnimationFrame(tick);
  }
 });

 renderScene(0);
})();
</script>
</body>
</html>
