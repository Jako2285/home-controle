<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0912">
<title>NEXUS — Personal Decision System</title>
<style>
:root{color-scheme:dark;--bg:#09080e;--surface:#12101a;--surface2:#191522;--surface3:#211b2e;--line:#30283e;--purple:#9b75ff;--purple2:#7650e8;--text:#f7f4ff;--muted:#a9a1b9;--green:#4ade80;--red:#fb7185;--yellow:#facc15;--orange:#fb923c;--radius:21px;--nav-height:73px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#28173d 0,transparent 48%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100dvh;font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed}
button:active:not(:disabled){transform:scale(.97)}
input,textarea,select{width:100%;min-width:0;background:#0d0b13;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:13px 14px;outline:none}
input::placeholder,textarea::placeholder{color:#777084}
textarea{resize:vertical;min-height:95px}
input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--purple)}
input[type=range]{padding:0;accent-color:var(--purple)}
input[type=date],input[type=time],input[type=datetime-local]{color-scheme:dark}
button,select{touch-action:manipulation}
svg{width:21px;height:21px;display:block;flex-shrink:0}
#app{max-width:740px;margin:auto;min-height:100dvh;padding-bottom:calc(var(--nav-height) + env(safe-area-inset-bottom) + 24px)}
.topbar{position:sticky;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;display:flex;align-items:center;gap:12px;background:#0b0912eF;backdrop-filter:blur(20px);border-bottom:1px solid #ffffff0a}
.brand-mark{width:43px;height:43px;border-radius:15px;background:linear-gradient(145deg,#a888ff,#7040d4);display:grid;place-items:center;box-shadow:0 6px 24px #8757ff35}
.brand-mark svg{color:white;width:25px;height:25px}
.brand{font-size:19px;font-weight:850;letter-spacing:1.7px;line-height:1.15}
.brand-sub{font-size:10px;color:var(--muted);letter-spacing:1px;margin-top:4px}
.top-spacer{flex:1}
.icon-btn{width:43px;height:43px;border:1px solid var(--line);background:var(--surface);border-radius:15px;display:grid;place-items:center}
.icon-btn svg{color:#c6b5ff}
main{padding:19px 16px 24px}
.page{animation:enter .22s ease}
@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
h1,h2,h3,p{margin-top:0}
h1{font-size:27px;letter-spacing:-.5px;margin-bottom:6px;line-height:1.25}
h2{font-size:18px;margin-bottom:13px}
h3{font-size:15px;margin-bottom:8px}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.section{margin-top:24px}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.section-head h2{margin:0}
.card{background:linear-gradient(145deg,#171320,#100e17);border:1px solid var(--line);border-radius:var(--radius);padding:17px;min-width:0}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#25173b,#171123 62%,#111019);border:1px solid #49336b;border-radius:25px;padding:22px}
.hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#8d5bff10;filter:blur(3px);top:-75px;inset-inline-end:-55px;pointer-events:none}
.hero-label{font-size:11px;letter-spacing:1.1px;color:#c9b7f7}
.hero-value{font-size:34px;font-weight:850;letter-spacing:-1px;margin:7px 0}
.hero-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:5px 10px;background:#ffffff0b;color:var(--muted);font-size:11px;border:1px solid #ffffff0c}
.pill.good{background:#163322;color:var(--green);border-color:#28563a}
